<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - KasRT Jaes</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; color: #4CAF50; }
    .btn-logout {
      background-color: #f44336;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .card h3 { margin: 0 0 10px 0; color: #888; font-size: 14px; }
    .card p { margin: 0; font-size: 24px; font-weight: bold; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏘️ Dashboard KasRT</h1>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="card-container">
    <div class="card">
      <h3>Total Kas</h3>
      <p id="totalKas">Rp 0</p>
    </div>
    <div class="card">
      <h3>Jumlah Warga</h3>
      <p id="jumlahWarga">0</p>
    </div>
    <div class="card">
      <h3>Transaksi Terakhir</h3>
      <p id="transaksiTerakhir">-</p>
    </div>
  </div>

  <script>
    // Cek apakah admin sudah login
    if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
      alert("Anda belum login!");
      window.location.href = "index.html";
    }

    // Fungsi Logout
    function logout() {
      sessionStorage.removeItem('isAdminLoggedIn');
      window.location.href = "index.html";
    }

    // Di sini nanti Anda bisa menambahkan kode untuk mengambil data
    // dari Firebase dan menampilkannya di kartu-kartu di atas.
    console.log("Dashboard siap. Silakan tambahkan logika Firebase di sini.");
  </script>
</body>
</html>
