<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - KasRT Jaes</title>
  <style>
    /* Reset & Font */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Kotak Login */
    .login-container {
      background-color: #1e1e1e;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid #333;
    }

    .logo-area {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 25px;
    }

    /* Input PIN */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 15px;
      font-size: 18px;
      letter-spacing: 5px;
      text-align: center;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #2c2c2c;
      color: #fff;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="password"]:focus {
      border-color: #4CAF50;
    }

    input[type="password"]::placeholder {
      letter-spacing: normal;
      font-size: 14px;
      color: #666;
    }

    /* Tombol Login */
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background-color: #4CAF50;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    button:hover {
      background-color: #45a049;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: #2e7d32;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Status Pesan */
    #status {
      margin-top: 20px;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.4;
    }

    /* Loading Spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-area">🏘️</div>
    <h2>Admin KasRT</h2>
    <p class="subtitle">Masukkan PIN untuk melanjutkan</p>

    <div class="input-group">
      <input type="password" id="pinInput" placeholder="Masukkan PIN" maxlength="10" autocomplete="off">
    </div>

    <button id="loginBtn">Masuk</button>
    <div id="status"></div>
  </div>

  <!-- Firebase SDK v10 (Modular) -->
  <script type="module">
    // ==========================================
    // 1. IMPOR FUNGSI DARI FIREBASE
    // ==========================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { 
      initializeAppCheck, 
      ReCaptchaEnterpriseProvider 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";

    // ==========================================
    // 2. KONFIGURASI FIREBASE (SUDAH DARI GAMBAR ANDA)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyA5XIndeyBJw4MDNebedRKDcjsVcuR1Zx8",
      authDomain: "jaes-c1b52.firebaseapp.com",
      databaseURL: "https://jaes-c1b52-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "jaes-c1b52",
      storageBucket: "jaes-c1b52.firebasestorage.app",
      messagingSenderId: "934203338301",
      appId: "1:934203338301:web:2bd353cec0b3f127e48454",
      measurementId: "G-QT5XKJSQ1X"
    };

    // ==========================================
    // 3. INISIALISASI FIREBASE
    // ==========================================
    const app = initializeApp(firebaseConfig);

    // ==========================================
    // 4. INISIALISASI APP CHECK (RECAPTCHA ENTERPRISE)
    // ==========================================
    const appCheck = initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider('6LcUO7wtAAAAAB9coinGrKNTXYjk-zzmrdKo64vg'),
      isTokenAutoRefreshEnabled: true 
    });

    // ==========================================
    // 5. INISIALISASI DATABASE
    // ==========================================
    const db = getDatabase(app);

    // ==========================================
    // 6. LOGIKA LOGIN MENGGUNAKAN PIN
    // ==========================================
    const loginBtn = document.getElementById('loginBtn');
    const pinInput = document.getElementById('pinInput');
    const statusEl = document.getElementById('status');

    loginBtn.addEventListener('click', async () => {
      const pin = pinInput.value.trim();

      if (!pin) {
        statusEl.innerHTML = "⚠️ PIN tidak boleh kosong.";
        statusEl.style.color = "#ff9800";
        return;
      }

      loginBtn.disabled = true;
      statusEl.innerHTML = '<span class="spinner"></span> Memeriksa PIN...';
      statusEl.style.color = "#aaa";

      try {
        // Mengambil data PIN admin dari database
        const snapshot = await get(ref(db, 'kasRt/adminPin'));

        if (!snapshot.exists()) {
          statusEl.innerHTML = "⚠️ Data PIN admin tidak ditemukan di database.";
          statusEl.style.color = "#ff9800";
          loginBtn.disabled = false;
          return;
        }

        const adminPin = String(snapshot.val());

        if (pin === adminPin) {
          statusEl.innerHTML = "✅ Login berhasil! Mengalihkan...";
          statusEl.style.color = "#4CAF50";

          sessionStorage.setItem('isAdminLoggedIn', 'true');

          // Redirect ke halaman dashboard
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);

        } else {
          statusEl.innerHTML = "❌ PIN salah. Silakan coba lagi.";
          statusEl.style.color = "#f44336";
          loginBtn.disabled = false;
          pinInput.value = ''; 
          pinInput.focus();
        }

      } catch (error) {
        console.error("Login Error:", error);
        
        if (error.message.includes("permission") || error.message.includes("Permission")) {
          statusEl.innerHTML = "⛔ Akses ditolak. Pastikan App Check sudah di-Enforce dan aturan database benar.";
        } else if (error.message.includes("network") || error.message.includes("Network")) {
          statusEl.innerHTML = "🌐 Koneksi internet bermasalah. Periksa jaringan Anda.";
        } else {
          statusEl.innerHTML = "⚠️ Terjadi kesalahan: " + error.message;
        }
        statusEl.style.color = "#f44336";
        loginBtn.disabled = false;
      }
    });

    pinInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loginBtn.click();
      }
    });

  </script>
</body>
</html>
